<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="PTY Time: explora San Miguelito en un videojuego panameño de pixel art. Demo jugable." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1020'/%3E%3Crect x='2' y='2' width='6' height='6' fill='%23da291c'/%3E%3Crect x='8' y='2' width='6' height='6' fill='%23ffffff'/%3E%3Crect x='2' y='8' width='6' height='6' fill='%23ffffff'/%3E%3Crect x='8' y='8' width='6' height='6' fill='%23005293'/%3E%3C/svg%3E" />
    <title>PTY Time · San Miguelito</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("/assets/ui/PressStart2P-Regular.ttf") format("truetype");
        font-display: swap;
        font-weight: normal;
        font-style: normal;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #ffd166;
        font-family: "Lucida Console", Monaco, monospace;
        font-size: 14px;
        letter-spacing: 2px;
        z-index: 5;
        transition: opacity 300ms ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">CARGANDO PTY TIME…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
